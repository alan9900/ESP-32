[platformio]
default_envs = ble_probe

[env:ble_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
  -D LV_CONF_INCLUDE_SIMPLE
  -I .
  ; Prevent Arduino BLE's default repeat-pairing handler from deleting a bond.
  -Wl,--wrap=_ZN9BLEServer21handleGATTServerEventEP13ble_gap_eventPv
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  lvgl/lvgl@8.4.0
  lewisxhe/XPowersLib@0.2.6
monitor_speed = 115200
